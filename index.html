
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./node_modules/@xterm/xterm/css/xterm.css">
  <title>Electron Bash Bridge</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #202020;
      color: white;
    }

    #top {
      height: 65vh;
      background: #303030;
      padding: 15px;
      box-sizing: border-box;
    }

    #bottom {
      background: #101010;
      padding: 15px;
      box-sizing: border-box;
      height: calc(35vh - 8px);
      overflow: auto;
    }
    #divider {
      height: 8px;
      background: #555;
      cursor: row-resize;
    }

    #divider:hover {
      background: #888;
    }
    #terminal {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="top">
    <div id="url-bar">
      <input id="ai-url" type="text" value="https://chatgpt.com"
            placeholder="Enter website URL">
      <button id="go-url" type="button">Go</button>
    </div>
    <h2>AI Webpage</h2>
    <p>ChatGPT will appear here.</p>
  </div>

  <div id="divider"></div>

  <div id="command-preview" style="display:block; padding:8px; background:#303030; color:white;">
      <strong>Clipboard command:</strong>
      <span id="command-text"></span>
      <button id="execute-command" type="button" style="margin-left:10px;">
        Execute
      </button>
      <button id="clear-terminal" type="button" style="margin-left:10px;">
        Clear Terminal
      </button>
   
  </div>
  <button id="copy-output" type="button" style="margin-left:10px;">
    Copy Output
  </button>

  <div id="bottom">
    
    <div id="terminal"></div>
  </div>
<script>
  const divider = document.getElementById('divider');

  divider.addEventListener('mousedown', (event) => {
    event.preventDefault();

    function drag(event) {
      const percentage = Math.max(
        20,
        Math.min(80, (event.clientY / window.innerHeight) * 100)
      );

      document.getElementById('top').style.height =
        percentage + 'vh';
      window.electronAPI.setSplit(percentage);
      document.getElementById('bottom').style.height =
       `calc(${100 - percentage}vh - 8px)`;
    }

    function stopDrag() {
      window.removeEventListener('mousemove', drag);
      window.removeEventListener('mouseup', stopDrag);
    }

    window.addEventListener('mousemove', drag);
    window.addEventListener('mouseup', stopDrag);
  });

  window.electronAPI.onClipboardChanged((text) => {
    console.log('Clipboard received:', text);

    document.getElementById('command-text').textContent = text;
    document.getElementById('command-preview').style.display = 'block';
  });
  
  document.getElementById('execute-command').addEventListener('click', () => {
    const command = document.getElementById('command-text').textContent;
    window.resetCommandOutput();
    window.electronAPI.sendTerminalInput(command + '\r');
    // window.electronAPI.commandExecuted();
    document.getElementById('command-text').textContent = '';
  });
 
  document.getElementById('go-url').addEventListener('click', () => {
    const url = document.getElementById('ai-url').value.trim();

    if (url) {
      window.electronAPI.changeAIURL(url);
    }
  });
  
</script>

<script src="./terminal.bundle.js"></script>

</body>
</html>
